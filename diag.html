<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>KRIO — diagnóstico do giroscópio</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; padding: 1.25rem 1.1rem 3rem;
        background: #0f0f10; color: #f4f2ea;
        font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      h1 { font-size: 1.05rem; margin: 0 0 1rem; color: #cffb24; letter-spacing: .02em; }
      .linha {
        display: flex; justify-content: space-between; gap: .75rem;
        padding: .5rem 0; border-bottom: 1px solid rgba(244,242,234,.12);
      }
      .rot { color: rgba(244,242,234,.6); }
      .val { text-align: right; word-break: break-all; }
      .sim { color: #cffb24; }
      .nao { color: #ff6b5e; }
      button {
        width: 100%; margin: 1.25rem 0 .5rem; padding: 1rem;
        font: inherit; font-weight: 700; letter-spacing: .05em;
        color: #0f0f10; background: #cffb24; border: 0; border-radius: .6rem;
      }
      #leitura { margin-top: 1.25rem; padding: .9rem; border: 1px solid rgba(207,251,36,.3); border-radius: .6rem; }
      .grande { font-size: 1.6rem; color: #cffb24; }
      .nota { margin-top: 1.5rem; color: rgba(244,242,234,.5); font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>KRIO — diagnóstico do giroscópio</h1>
    <div id="fatos"></div>

    <button id="ligar">1. TOCAR AQUI PARA LIGAR O SENSOR</button>

    <div id="leitura">
      <div class="linha"><span class="rot">eventos recebidos</span><span class="val grande" id="n">0</span></div>
      <div class="linha"><span class="rot">beta (frente/trás)</span><span class="val" id="beta">—</span></div>
      <div class="linha"><span class="rot">gamma (esquerda/direita)</span><span class="val" id="gamma">—</span></div>
      <div class="linha"><span class="rot">permissão</span><span class="val" id="perm">não pedida</span></div>
    </div>

    <p class="nota">
      2. Incline o aparelho para os lados depois de tocar no botão.<br />
      3. Mande um print desta tela inteira.
    </p>

    <script>
      const fatos = document.getElementById("fatos");
      const linha = (rot, val, ok) => {
        const cls = ok === true ? "sim" : ok === false ? "nao" : "";
        fatos.insertAdjacentHTML(
          "beforeend",
          '<div class="linha"><span class="rot">' + rot +
            '</span><span class="val ' + cls + '">' + val + "</span></div>"
        );
      };

      const temDOE = typeof DeviceOrientationEvent !== "undefined";
      const precisaPerm = temDOE && typeof DeviceOrientationEvent.requestPermission === "function";
      const reduz = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const fino = matchMedia("(pointer: fine)").matches;

      linha("DeviceOrientationEvent", temDOE ? "existe" : "NÃO EXISTE", temDOE);
      linha("pede permissão (iOS)", precisaPerm ? "sim" : "não (Android)");
      linha("pointer: fine", fino ? "SIM — trata como desktop" : "não (ok)", !fino);
      linha("movimento reduzido", reduz ? "LIGADO — bloqueia o efeito" : "desligado (ok)", !reduz);
      linha("https", location.protocol === "https:" ? "sim" : "NÃO", location.protocol === "https:");
      linha("navegador", navigator.userAgent.slice(0, 70));

      let n = 0;
      const onOrient = (e) => {
        n += 1;
        document.getElementById("n").textContent = n;
        document.getElementById("beta").textContent = e.beta == null ? "null" : e.beta.toFixed(1);
        document.getElementById("gamma").textContent = e.gamma == null ? "null" : e.gamma.toFixed(1);
      };

      const escutar = () => {
        window.addEventListener("deviceorientation", onOrient);
        document.getElementById("ligar").textContent = "SENSOR LIGADO — INCLINE O APARELHO";
      };

      document.getElementById("ligar").addEventListener("click", () => {
        if (precisaPerm) {
          DeviceOrientationEvent.requestPermission()
            .then((r) => {
              document.getElementById("perm").textContent = r;
              document.getElementById("perm").className = "val " + (r === "granted" ? "sim" : "nao");
              if (r === "granted") escutar();
            })
            .catch((err) => {
              document.getElementById("perm").textContent = "erro: " + err.message;
              document.getElementById("perm").className = "val nao";
            });
        } else {
          document.getElementById("perm").textContent = "não precisa";
          escutar();
        }
      });
    </script>
  </body>
</html>
